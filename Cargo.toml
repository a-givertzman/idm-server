[package]
name = "idm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "~0.4"
env_logger = "~0.11"
#
#
sal-core = { git = "https://github.com/a-givertzman/rust-sal-core.git", tag = "0.1.0" }
sal-sync = { git = "https://github.com/a-givertzman/rust-sal-sync.git", tag = "0.3.0" }
api-tools = { git = "https://github.com/a-givertzman/rust-api-tools.git", tag = "0.2.1" }
debugging = { git = "https://github.com/a-givertzman/rust-debuging.git", tag = "0.0.1" }
testing = { git = "https://github.com/a-givertzman/rust-testing.git", tag = "0.1.2" }
#
# Serde
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
serde_yaml = "~0.9"
bincode = "~2.0"
#
# Collections
indexmap = "~2.10"
#
# Thread safe
kanal = "~0.1"
coco = "~0.3"
papaya = "~0.2"
#
# Misc
rand = "~0.9"