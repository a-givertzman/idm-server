[package]
name = "idm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "~0.4"
env_logger = "~0.11"
#
#
sal-core = { tag = "0.1.0", git = "https://github.com/a-givertzman/rust-sal-core.git" }
sal-sync = { tag = "0.3.0", git = "https://github.com/a-givertzman/rust-sal-sync.git" }
api-tools = { tag = "0.2.2", git = "https://github.com/a-givertzman/rust-api-tools.git" }
debugging = { tag = "0.1.0", git = "https://github.com/a-givertzman/rust-debuging.git" }
testing = { tag = "0.1.2", git = "https://github.com/a-givertzman/rust-testing.git" }
#
# Serde
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
serde_yaml = "~0.9"
bincode = { version = "~2.0", features = ["serde"] }
#
# Collections
indexmap = "~2.12"
#
# Thread safe
kanal = "~0.1"
papaya = "~0.2"
#
# Misc
rand = "~0.9"